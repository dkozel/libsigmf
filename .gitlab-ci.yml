
stages:
    - build
    - check
    - deploy

build-20.04:
    stage: build
    image: ubuntu:20.04
    before_script:
        - apt update && apt install -y cmake build-essential git
        - git submodule update --init --recursive

    script:
        - mkdir build && cd build
        - cmake ..
        - make
        - ./examples/example_sigmf_json_roundtrip
    artifacts:
        paths: 
            - build
        reports:
            performance:
                - performance.json
        expire_in:
            1 week


build-24.04:
    stage: build
    image: ubuntu:24.04
    before_script:
        - apt update && apt install -y cmake build-essential git
        - git submodule update --init --recursive
    script:
        - mkdir build && cd build
        - cmake ..
        - make
        - ./examples/example_sigmf_json_roundtrip 
    artifacts:
        paths: 
            - build
        expire_in:
            1 week

test-20.04:
    stage: check
    dependencies:
        - build-20.04
    image: ubuntu:20.04
    before_script:
        - apt update && apt install -y valgrind
    script:
        - valgrind --tool=memcheck --leak-check=full --show-leak-kinds=all build/examples/example_sigmf_json_roundtrip

test-24.04:
    stage: check
    dependencies:
        - build-24.04
    image: ubuntu:24.04
    before_script:
        - apt update && apt install -y valgrind
    script:
        - valgrind --tool=memcheck --leak-check=full --show-leak-kinds=all build/examples/example_sigmf_json_roundtrip


pages:
    stage: deploy
    image: python:alpine
    before_script:
        - pip install mkdocs
    script:
        - mkdocs build
        - mv site public
    artifacts:
        paths:
            - public
    only:
        - master

